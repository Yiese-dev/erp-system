global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["identity:8000", "academic:8000", "finance:8000", "hr:8000"]
  - job_name: workers
    static_configs:
      - targets: ["academic-worker:9100", "finance-worker:9100", "hr-worker:9100"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: log-pipeline
    metrics_path: /api/v2/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]
