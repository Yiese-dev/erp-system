worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  log_format json escape=json '{"service":"gateway","level":"info","time":"$time_iso8601","request_id":"$request_id",'
    '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,"upstream":"$upstream_addr","upstream_ms":"$upstream_response_time"}';
  access_log /dev/stdout json;
  access_log syslog:server=fluent-bit:5140,tag=gateway,nohostname json;

  # Gateway rate limits: generous per-IP API budget, strict budget for credential endpoints (account lockout is separate).
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=credentials:10m rate=10r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # Session-validation results are cached for 10 s per bearer token to spare Identity on bursts.
  proxy_cache_path /tmp/auth_cache levels=1 keys_zone=auth_cache:10m max_size=50m inactive=60s use_temp_path=off;

  # Static service registry (Docker Compose DNS names); see README "Service registry".
  upstream identity { server identity:8000; keepalive 32; }
  upstream academic { server academic:8000; keepalive 32; }
  upstream finance  { server finance:8000;  keepalive 32; }
  upstream hr       { server hr:8000;       keepalive 32; }

  server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    limit_conn perip 200;

    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    error_page 401 = @unauthenticated;
    error_page 429 = @rate_limited;
    error_page 500 502 503 504 = @unavailable;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /_auth {
      internal;
      proxy_pass http://identity/api/v1/auth/validate;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_cache auth_cache;
      proxy_cache_key $http_authorization;
      proxy_cache_valid 200 10s;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
    }

    # Identity: credential endpoints are public but strictly rate-limited.
    location ~ ^/api/v1/auth/(login|refresh)$ {
      limit_req zone=credentials burst=10 nodelay;
      proxy_pass http://identity;
    }
    location /api/v1/auth/ { limit_req zone=api burst=200 nodelay; proxy_pass http://identity; }
    location /api/v1/platform/ { limit_req zone=api burst=200 nodelay; proxy_pass http://identity; }

    # Public API documentation and health probes for each domain service.
    location ~ ^/api/v1/(academic|finance|hr)/(openapi\.json|health/live|health/ready)$ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://$1;
    }
    location ~ ^/api/v1/(academic|finance|hr)/docs$ {
      limit_req zone=api burst=20 nodelay;
      include /etc/nginx/security-headers.conf;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'" always;
      proxy_pass http://$1;
    }
    location = /api/v1/auth/docs {
      limit_req zone=api burst=20 nodelay;
      include /etc/nginx/security-headers.conf;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'" always;
      proxy_pass http://identity;
    }
    location ~ ^/api/v1/auth/(openapi\.json|health/live|health/ready)$ { proxy_pass http://identity; }

    # Mobile-money provider callbacks: authenticated by HMAC signature, not a user session.
    location /api/v1/finance/payment-webhooks/ { limit_req zone=api burst=50 nodelay; proxy_pass http://finance; }

    # Domain APIs: every request is authenticated by Identity first (auth delegation), then authorised by the service.
    location /api/v1/academic/ { auth_request /_auth; limit_req zone=api burst=200 nodelay; proxy_pass http://academic; }
    location /api/v1/finance/  { auth_request /_auth; limit_req zone=api burst=200 nodelay; proxy_pass http://finance; }
    location /api/v1/hr/       { auth_request /_auth; limit_req zone=api burst=200 nodelay; proxy_pass http://hr; }

    location /api/ {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"Unknown API route. Supported version: /api/v1.","fields":[],"details":null,"request_id":"$request_id"}}';
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }

    location @unauthenticated {
      default_type application/json;
      return 401 '{"error":{"code":"unauthenticated","message":"Your session has expired. Please sign in again.","fields":[],"details":null,"request_id":"$request_id"}}';
    }
    location @rate_limited {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Please wait a moment and try again.","fields":[],"details":null,"request_id":"$request_id"}}';
    }
    location @unavailable {
      default_type application/json;
      return 503 '{"error":{"code":"unavailable","message":"The service is temporarily unavailable. Please try again shortly.","fields":[],"details":null,"request_id":"$request_id"}}';
    }
  }
}
